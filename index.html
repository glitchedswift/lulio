<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#58cc02" />
  <title>Lulio · Aprende català</title>
  <meta name="description" content="Lulio: aprende català desde el español, jugando. Sin cuentas, sin descargas." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/main.css" />

  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
</head>
<body>
  <header class="topbar">
    <a href="#/" class="brand" aria-label="Lulio inicio">
      <img src="assets/logo.svg" alt="" class="brand-logo" />
      <span class="brand-name">Lulio</span>
    </a>
    <div class="topbar-right">
      <span class="xp-pill" id="xp-pill" title="XP">
        <span class="xp-icon">★</span>
        <span id="xp-value">0</span>
      </span>
      <button class="lang-toggle" id="lang-toggle" type="button" aria-label="Cambiar idioma de la interfaz">
        <span data-lang="es">ES</span><span class="lang-sep">·</span><span data-lang="ca">CA</span>
      </button>
    </div>
  </header>

  <main id="view" class="view"></main>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
  <script type="module" src="js/app.js"></script>
  <script data-goatcounter="https://lulio-cat.goatcounter.com/count"
          data-goatcounter-settings='{"no_onload":true}'
          async src="//gc.zgo.at/count.js"></script>
</body>
</html>
